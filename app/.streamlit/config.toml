# Fact-Check Lab theme (T58 redesign, 8 Nov): a published fact-check rather than a dashboard.
# Warm paper ground, charcoal ink, one Prussian-blue action colour, serif headings. Brick, ochre
# and bottle green mean verdicts (and the words that push towards them) and nothing else; the
# blue tint marks style shortcuts. Locked to light so the video recording always looks the same.

[theme]
base = "light"
primaryColor = "#1e3a5f"
backgroundColor = "#faf8f5"
secondaryBackgroundColor = "#f1ede6"
textColor = "#18181b"
linkColor = "#1e3a5f"
linkUnderline = true
borderColor = "#d6d1c7"
showWidgetBorder = true
showSidebarBorder = true
codeBackgroundColor = "#f1ede6"
codeTextColor = "#18181b"

# Verdicts: text colours pass WCAG AA on the paper and on their own tint.
redColor = "#b8332a"
redTextColor = "#9e2b23"
redBackgroundColor = "#f8e3e0"
orangeColor = "#9a5b00"
orangeTextColor = "#8a5200"
orangeBackgroundColor = "#f7ead0"
yellowColor = "#9a5b00"
yellowTextColor = "#8a5200"
yellowBackgroundColor = "#f7ead0"
greenColor = "#0b6e4f"
greenTextColor = "#0a5f44"
greenBackgroundColor = "#dcefe6"
blueColor = "#1e3a5f"
blueTextColor = "#1e3a5f"
blueBackgroundColor = "#dde7f3"
grayColor = "#52525b"
grayTextColor = "#52525b"
grayBackgroundColor = "#ebe6dd"

font = "'Public Sans':https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Newsreader':https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 17
headingFontSizes = ["2.6rem", "2.1rem", "1.35rem", "1.15rem", "1rem", "0.9rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "2.1rem"
metricValueFontWeight = 600

baseRadius = "2px"
buttonRadius = "2px"

dataframeHeaderBackgroundColor = "#f1ede6"
dataframeHeaderTextColor = "#18181b"
dataframeBorderColor = "#d6d1c7"
# Model families from the bottom of the ladder to the top, one hue light to dark. No verdict
# colours here: brick, ochre and green mean verdicts only.
chartCategoricalColors = ["#8fa3bd", "#5d7a9e", "#3a5a80", "#1e3a5f", "#0f2340"]

paddingTop = "1.5rem"

[theme.sidebar]
backgroundColor = "#f1ede6"
secondaryBackgroundColor = "#e8e2d8"
textColor = "#18181b"
borderColor = "#d6d1c7"

[client]
toolbarMode = "minimal"  # no Deploy button or developer menu in the demo recording

[server]
# The file watcher walks every transformers module and logs a torchvision traceback for each
# vision model. Harmless, but noisy in the terminal; restart the app after editing code.
fileWatcherType = "none"
