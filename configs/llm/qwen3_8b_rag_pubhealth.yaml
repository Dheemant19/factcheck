# T20 evidence RAG LLM: Qwen3-8B (thinking off) on pubhealth with the 5 sentences of each
# claim's own fact-check article most similar to the claim (factcheck.prompts.rag_messages).
# The article is the fact-checker's, so it can state the verdict: an optimistic setting.
run:
  name: qwen3_8b_rag_pubhealth
  seed: 42
data:
  dataset: pubhealth
  variant: raw
model:
  family: llm
  name: Qwen/Qwen3-8B
  method: rag
features:
  use_evidence: true
  evidence_k: 5
  evidence_source: own
train:
  eval_batch_size: 16
