# T54 traditional baseline (plan Section 8.0) on isot: TF-IDF word 1-2 grams -> logistic regression.
# Regularisation picked on validation macro-F1 from the grid in factcheck/models/classic.py;
# deterministic, so one run (seed 42) is enough.
# ISOT articles are long, so only word n-grams (character n-grams would be millions of
# features). RAW text, with the source shortcuts left in: the other half of the T28-style
# raw vs clean comparison for a traditional model.
run:
  name: tfidf_lr_isot_raw
  seed: 42
data:
  dataset: isot
  variant: raw
model:
  family: classic
  name: tfidf
  method: tfidf_lr
  char_ngrams: null
