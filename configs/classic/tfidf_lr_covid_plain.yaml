# T59 style-stripped COVID (owner M1): tfidf_lr_covid trained on the text with its surface
# style removed (links, @mentions, hashtags, emoji, "!", capitals; factcheck/style.py), so the
# score drop against tfidf_lr_covid is what the model got from style. Deterministic: seed 42.
run:
  name: tfidf_lr_covid_plain
  seed: 42
data:
  dataset: covid
  variant: raw
model:
  family: classic
  name: tfidf
  method: tfidf_lr
features:
  strip_style: true
