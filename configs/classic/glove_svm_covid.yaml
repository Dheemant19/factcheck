# T54 traditional baseline (plan Section 8.0) on covid: mean of the frozen GloVe 300-d word vectors -> linear SVM (sigmoid-calibrated).
# Regularisation picked on validation macro-F1 from the grid in factcheck/models/classic.py;
# deterministic, so one run (seed 42) is enough.
run:
  name: glove_svm_covid
  seed: 42
data:
  dataset: covid
  variant: raw
model:
  family: classic
  name: glove-300d
  method: glove_svm
