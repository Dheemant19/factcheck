# T55 recurrent cells on covid: plain tanh RNN, grad clip 1.0, one direction, next to the Bi-LSTM
# (lstm_covid.yaml). Same settings as the Bi-LSTM otherwise (plan Section 10 defaults in
# factcheck/models/lstm.py); gradient sizes go to train_summary.json.
run:
  name: rnn_covid
  seed: 42
data:
  dataset: covid
  variant: raw
model:
  family: lstm
  name: rnn-glove300
  cell: rnn
  bidirectional: false
train:
  learning_rate: 1.0e-3
  batch_size: 64
  epochs: 15
