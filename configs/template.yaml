# Template for one run. Copy this file, fill it in, and keep one file per run.
run:
  name: distilbert_covid      # used for outputs/<name>/seed<N>/ and in results/runs.csv
  seed: 42
data:
  dataset: covid              # covid, liar, pubhealth, isot, climate_fever
  variant: raw                # raw, or clean (shortcut-removed copy, T13)
features:                     # extra-effort switches (T15); both off when left out
  use_metadata: false         # liar only: [speaker | party | subject | context] prefix
  use_evidence: false         # pubhealth / climate_fever only: claim + evidence pair
  evidence_k: 5               # evidence sentences per claim
model:
  family: encoder             # lstm, encoder, llm or knn
  name: distilbert-base-uncased
  method: full                # full, lora, qlora, zeroshot, knn, rag
train:
  learning_rate: 2.0e-5
  batch_size: 32
  epochs: 4
