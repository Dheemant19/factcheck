# T19 large encoder (E1): microsoft/deberta-v3-large on covid.
# Large-encoder settings from plan Section 10: learning rate 1e-5,
# effective batch 16, up to 3 epochs; the rest are the defaults in factcheck/models/encoder.py.
run:
  name: deberta_v3_large_covid
  seed: 42
data:
  dataset: covid
  variant: raw
model:
  family: encoder
  name: microsoft/deberta-v3-large
  method: full
train:
  learning_rate: 1.0e-5
  batch_size: 16
  epochs: 3
