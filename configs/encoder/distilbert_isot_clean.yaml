# T17 base encoder sweep (E1): distilbert-base-uncased on isot with source shortcuts removed (T13). Unlisted settings use the plan
# Section 10 defaults in factcheck/models/encoder.py (AdamW, 6% warmup, up to 4 epochs, bf16).
run:
  name: distilbert_isot_clean
  seed: 42
data:
  dataset: isot
  variant: clean
  head_tokens: 128  # 512 tokens = head 128 + tail 382 (plan Section 10)
model:
  family: encoder
  name: distilbert-base-uncased
  method: full
train:
  learning_rate: 2.0e-5
  batch_size: 16  # 512 tokens: batch 16
  epochs: 4
