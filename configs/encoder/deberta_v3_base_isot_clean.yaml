# T17 base encoder sweep (E1): microsoft/deberta-v3-base on isot with source shortcuts removed (T13). Unlisted settings use the plan
# Section 10 defaults in factcheck/models/encoder.py (AdamW, 6% warmup, up to 4 epochs, bf16).
run:
  name: deberta_v3_base_isot_clean
  seed: 42
data:
  dataset: isot
  variant: clean
  head_tokens: 128  # 512 tokens = head 128 + tail 382 (plan Section 10)
model:
  family: encoder
  name: microsoft/deberta-v3-base
  method: full
train:
  learning_rate: 2.0e-5
  batch_size: 16  # 512 tokens: batch 16
  epochs: 4
