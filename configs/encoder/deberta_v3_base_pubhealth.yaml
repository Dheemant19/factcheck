# T17 base encoder sweep (E1): microsoft/deberta-v3-base on pubhealth. Unlisted settings use the plan
# Section 10 defaults in factcheck/models/encoder.py (AdamW, 6% warmup, up to 4 epochs, bf16).
run:
  name: deberta_v3_base_pubhealth
  seed: 42
data:
  dataset: pubhealth
  variant: raw
model:
  family: encoder
  name: microsoft/deberta-v3-base
  method: full
train:
  learning_rate: 2.0e-5
  batch_size: 16  # 384 tokens (claim + evidence later, T14/T15): batch 16
  epochs: 4
