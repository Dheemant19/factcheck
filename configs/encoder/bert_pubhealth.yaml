# T06 base encoder baseline: bert-base-uncased on pubhealth. Unlisted settings use the plan Section 10
# defaults in factcheck/models/encoder.py (AdamW, 6% warmup, up to 4 epochs, bf16).
run:
  name: bert_pubhealth
  seed: 42
data:
  dataset: pubhealth
  variant: raw
model:
  family: encoder
  name: bert-base-uncased
  method: full
train:
  learning_rate: 2.0e-5
  batch_size: 16  # 384 tokens (claim + evidence later, T14/T15): batch 16
  epochs: 4
