# T26 LoRA: FacebookAI/roberta-large on liar, rank 4 adapters on every linear layer of the encoder;
# the head trains in full. Batch settings as the T19 full fine-tune (roberta_large_liar),
# lr 1e-4, 10% warmup: at 3e-4 roberta-large collapsed to one class (val 0.17); 1e-4 gave
# val 0.50 and 3e-5 0.43 (rank 16, attention, PUBHEALTH).
run:
  name: roberta_large_lora_r4_all_liar
  seed: 42
data:
  dataset: liar
  variant: raw
model:
  family: encoder
  name: FacebookAI/roberta-large
  method: lora
  lora_r: 4
  lora_targets: all_linear
train:
  learning_rate: 1.0e-4
  batch_size: 16
  epochs: 4
  warmup_ratio: 0.1
