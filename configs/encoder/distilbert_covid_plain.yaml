# T59 style-stripped COVID (owner M1): distilbert_covid trained on the text with its surface
# style removed (factcheck/style.py); same settings and seeds (13 42 2026) as distilbert_covid.
run:
  name: distilbert_covid_plain
  seed: 42
data:
  dataset: covid
  variant: raw
model:
  family: encoder
  name: distilbert-base-uncased
  method: full
train:
  learning_rate: 2.0e-5
  batch_size: 32
  epochs: 4
features:
  strip_style: true
