# T18 tuned settings for deberta_v3_base_covid: trial 17, the best of 30 Optuna
# trials (validation macro-F1 0.9747). Written by
# python -m factcheck.tune --config configs/encoder/deberta_v3_base_covid.yaml --export
run:
  name: deberta_v3_base_covid_tuned
  seed: 42
data:
  dataset: covid
  variant: raw
  max_length: 128
model:
  family: encoder
  name: microsoft/deberta-v3-base
  method: full
  dropout: 0.02845209001254729
  freeze_layers: 0
train:
  learning_rate: 2.5424644553537235e-05
  batch_size: 32
  epochs: 3
  warmup_ratio: 0.17173433768017732
  weight_decay: 0.09472503894443988
  grad_accum: 2
