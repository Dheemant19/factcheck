# T06 base encoder baseline: bert-base-uncased on liar. Unlisted settings use the plan Section 10
# defaults in factcheck/models/encoder.py (AdamW, 6% warmup, up to 4 epochs, bf16).
run:
  name: bert_liar
  seed: 42
data:
  dataset: liar
  variant: raw
model:
  family: encoder
  name: bert-base-uncased
  method: full
train:
  learning_rate: 2.0e-5
  batch_size: 32
  epochs: 4
