# T17 base encoder sweep (E1): answerdotai/ModernBERT-base on liar. Unlisted settings use the plan
# Section 10 defaults in factcheck/models/encoder.py (AdamW, 6% warmup, up to 4 epochs, bf16).
run:
  name: modernbert_liar
  seed: 42
data:
  dataset: liar
  variant: raw
model:
  family: encoder
  name: answerdotai/ModernBERT-base
  method: full
train:
  learning_rate: 2.0e-5
  batch_size: 32
  epochs: 4
