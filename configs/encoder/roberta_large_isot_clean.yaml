# T19 large encoder (E1): FacebookAI/roberta-large on isot with source shortcuts removed (T13).
# Large-encoder settings from plan Section 10: learning rate 1e-5,
# effective batch 16, up to 3 epochs; the rest are the defaults in factcheck/models/encoder.py.
run:
  name: roberta_large_isot_clean
  seed: 42
data:
  dataset: isot
  variant: clean
  head_tokens: 128  # 512 tokens = head 128 + tail 382 (plan Section 10)
model:
  family: encoder
  name: FacebookAI/roberta-large
  method: full
train:
  learning_rate: 1.0e-5
  batch_size: 8
  grad_accum: 2  # effective batch 16 at 384 to 512 tokens
  epochs: 3
