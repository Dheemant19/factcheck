# T06 base encoder baseline: distilbert-base-uncased on covid. Unlisted settings use the plan Section 10
# defaults in factcheck/models/encoder.py (AdamW, 6% warmup, up to 4 epochs, bf16).
run:
  name: distilbert_covid
  seed: 42
data:
  dataset: covid
  variant: raw
model:
  family: encoder
  name: distilbert-base-uncased
  method: full
train:
  learning_rate: 2.0e-5
  batch_size: 32
  epochs: 4
