# T19 domain model (scientific vocabulary, used by the PUBHEALTH authors) (E1): allenai/scibert_scivocab_uncased on pubhealth.
# Base-encoder settings from plan Section 10, the same as
# T17; unlisted ones are the defaults in factcheck/models/encoder.py.
run:
  name: scibert_pubhealth
  seed: 42
data:
  dataset: pubhealth
  variant: raw
model:
  family: encoder
  name: allenai/scibert_scivocab_uncased
  method: full
train:
  learning_rate: 2.0e-5
  batch_size: 16  # 384 tokens: batch 16
  epochs: 4
